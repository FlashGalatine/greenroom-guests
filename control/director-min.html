<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Greenroom director-min</title>
<!--
  Greenroom director-min — the always-on 1×1 variant of the control page: hidden
  vdo.ninja director iframe + the 2.5 s label→streamID resolution loop + VDO Push.
  NO editor UI — it adopts its config (room/password/slot labels, and the guest
  `directory` + its `directoryAutoAdd`/`directoryIgnored` companions, which it
  carries through untouched so its pushes never strip them) from the persisted
  vdo.state that "VDO Sync" replays, and from any control.html pushes.

  It DOES auto-populate the guest directory (control/directory-core.js, shared with
  control.html): a new label in the room or a new user in the voice channel gets a
  placeholder entry named after them, so nameplates appear with no operator
  present. Editing the name in control.html makes it yours; removing the entry
  there ignores that guest. `directoryAutoAdd:false` turns the whole thing off.

  Deploy as a tiny always-on OBS Browser Source (e.g. 1×1 px in a corner of every
  scene collection you stream with):
      http://127.0.0.1:7474/greenroom-control/director-min.html
  That keeps auto-follow-on-rejoin alive with zero operator attention; open
  control.html only when you want to edit slots. Prefer ONE long-lived director
  page (this one). While control.html is open it also hosts a director iframe, so
  expect a brief two-director overlap — their rosters converge within a poll, and
  the signature gates prevent push ping-pong; real vdo.ninja multi-director
  behavior stays on the live-validation checklist (docs/STREAMERBOT-SETUP.md).

  Config: ?sbport=<n> · window.__SB_WS_URL · window.__VDO_DIRECTOR_URL (test hook).
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #status { font: 10px/1.4 Consolas, monospace; color: #7ee787; background: rgba(10,14,18,.8);
    padding: 2px 6px; display: inline-block; white-space: nowrap; }
  #vdoDirector { position: fixed; width: 1px; height: 1px; right: 0; bottom: 0;
    opacity: .01; border: 0; pointer-events: none; }
</style>
</head>
<body>
<span id="status">greenroom director: boot…</span>
<iframe id="vdoDirector" title="VDO director (enumeration)" allow="autoplay" referrerpolicy="no-referrer" src="about:blank"></iframe>
<script src="vdo-parse.js"></script>
<script src="directory-core.js"></script>
<script>
(function () {
  'use strict';

  const P = new URLSearchParams(location.search);
  // <sb-conn> — the connection helpers. The SAME text is in overlay/panel-client-sb.js,
  // control/control.html and control/director-min.html (they sit behind different Streamer.bot
  // folder maps and cannot share a file); verify.mjs fails if the three copies differ.
  const SB_DEFAULT_PORT = 8080;
  // ?sbport -> the WebSocket URL. Only a port can come from the page URL: the host is always
  // 127.0.0.1. Returns null when ?sbport is present but is not a whole number from 1 to 65535.
  function sbWsUrl(search) {
    const raw = new URLSearchParams(search).get('sbport');
    const u = new URL('ws://127.0.0.1:' + SB_DEFAULT_PORT + '/');
    if (raw === null) return u.href;
    if (!/^\d{1,5}$/.test(raw)) return null;
    const port = Number(raw);
    if (port < 1 || port > 65535) return null;
    u.port = String(port);
    return u.href;
  }
  // The ?sbport to copy into an OBS source URL: the validated port, or '' when absent or invalid.
  function sbPortParam(search) {
    const raw = new URLSearchParams(search).get('sbport');
    return raw !== null && sbWsUrl(search) !== null ? String(Number(raw)) : '';
  }
  // Reconnect delay: 1 s, then x1.5 up to 4 s. Call reset() only after a healthy session (a valid
  // Subscribe ack or a General.Custom message), not on open, so a server that accepts and then
  // drops still reaches the cap.
  function sbBackoff() {
    const BASE_MS = 1000, MAX_MS = 4000, FACTOR = 1.5;
    let delay = BASE_MS;
    return {
      next() { const d = delay; delay = Math.min(delay * FACTOR, MAX_MS); return d; },
      reset() { delay = BASE_MS; },
    };
  }
  // </sb-conn>
  const WS_URL = window.__SB_WS_URL || sbWsUrl(location.search); // null: an invalid ?sbport
  const PUSH_ACTION = 'VDO Push';
  const SYNC_ACTION = 'VDO Sync';
  const SLOT_COUNT = 4;
  const POLL_MS = 2500;
  const FIRST_PROBE_MS = 1500;
  const DIRECTOR_BASE = window.__VDO_DIRECTOR_URL || 'https://vdo.ninja/';
  const DIRECTOR_ORIGIN = new URL(DIRECTOR_BASE, location.href).origin;

  // Wire compatibility (same rules as control.html). Fields this page does not know pass
  // through every push; `rev` and `writer` are reserved for a later release and are never
  // copied. A saved config with a higher schemaVersion makes this page stop pushing.
  const SCHEMA_VERSION = 1;
  const TOP_KEYS = new Set(['enabled', 'room', 'password', 'viewFlags', 'slots', 'invite', 'directory',
    'directoryAutoAdd', 'directoryIgnored', 'schemaVersion', 'rev', 'writer']);
  const SLOT_KEYS = new Set(['slot', 'label', 'streamID', 'mirror', 'mode', 'discordUserId']);
  const MSG_RELOAD = 'the saved config comes from a newer Greenroom: reload this page; it pushes nothing until you do';
  let schemaTooNew = false;

  const statusEl = document.getElementById('status');
  const director = document.getElementById('vdoDirector');
  // connProblem is a connection fault that stays on screen until a healthy session replaces it
  // (a refused Subscribe or DoAction, an authentication-enforcing Streamer.bot, an invalid ?sbport).
  let connProblem = '';
  const show = (t) => { statusEl.textContent = 'greenroom director: ' + (connProblem || (schemaTooNew ? MSG_RELOAD : t)); };

  function defaultSlots() {
    const out = [];
    for (let i = 0; i < SLOT_COUNT; i++) out.push({ label: '', streamID: '', mirror: false, mode: 'webcam', discordUserId: '' });
    return out;
  }
  let cfg = { enabled: false, room: '', password: '', viewFlags: '', slots: defaultSlots(), invite: {},
    directory: [], directoryAutoAdd: true, directoryIgnored: [], extra: {} };
  let roster = [];
  let hasRoster = false;
  // synced: Streamer.bot has answered with the saved config (a vdoninja:update, adopted
  // or our own echo) or said there is none (vdo:sync:empty). Until then this page pushes
  // nothing: its defaults would overwrite the saved vdo.state.
  let synced = false;
  let syncTimer = null;
  let lastPushedSig = '';
  let frameUrl = '';
  let pollTimer = null;
  let discordUsers = {};    // last discord:voice:update users map (auto-add input only)

  // The directory sanitizers + auto-populate live in directory-core.js, shared
  // verbatim with control.html so both pages produce identical payloads.
  const sanitizeDirectory = (raw) => GRDir.sanitizeDirectory(raw);

  const isPlainObject = (v) => !!v && typeof v === 'object' && !Array.isArray(v);

  // The state in a vdoninja:update / discord:voice:update frame: the old object field,
  // or an escaped string field beside it (vdoninjaJson / discordVoiceJson). A present
  // string field is authoritative: one that does not parse to a plain object makes the
  // frame unusable (null), so a malformed frame can never mark the page synced.
  function frameState(d, objKey, jsonKey) {
    if (jsonKey in d) {
      if (typeof d[jsonKey] !== 'string') return null;
      let v;
      try { v = JSON.parse(d[jsonKey]); } catch { return null; }
      return isPlainObject(v) ? v : null;
    }
    return isPlainObject(d[objKey]) ? d[objKey] : null;
  }

  // Returns true only when it adopted something config-shaped: a plain object with
  // slots, directory or room.
  function adoptCfg(v) {
    if (!isPlainObject(v)) return false;
    if (!Array.isArray(v.slots) && !Array.isArray(v.directory) && !('room' in v)) return false;
    const slots = defaultSlots();
    if (Array.isArray(v.slots)) {
      for (const s of v.slots) {
        const i = Number(s && s.slot) - 1;
        if (!Number.isInteger(i) || i < 0 || i >= SLOT_COUNT) continue;
        slots[i] = Object.assign({
          label: String(s.label ?? ''),
          streamID: String(s.streamID ?? ''),
          mirror: !!s.mirror,
          mode: s.mode === 'discord' ? 'discord' : 'webcam',
          discordUserId: String(s.discordUserId ?? '').replace(/\D/g, ''),
        }, GRDir.extraFields(s, SLOT_KEYS)); // unknown slot fields pass through
      }
    }
    // A saved config from a newer Greenroom than this page: follow it, but never push over it.
    const sv = Number(v.schemaVersion);
    schemaTooNew = Number.isFinite(sv) && sv > SCHEMA_VERSION;
    cfg = {
      enabled: !!v.enabled,
      room: String(v.room ?? ''),
      password: String(v.password ?? ''),
      viewFlags: String(v.viewFlags ?? ''),
      slots,
      invite: (v.invite && typeof v.invite === 'object') ? v.invite : {},
      directory: sanitizeDirectory(v.directory),
      directoryAutoAdd: v.directoryAutoAdd !== false, // absent (pre-upgrade state) → on
      directoryIgnored: GRDir.sanitizeIgnored(v.directoryIgnored),
      extra: GRDir.extraFields(v, TOP_KEYS), // unknown top-level fields pass through (never rev/writer)
    };
    return true;
  }

  // ── Sync state (GRN-24) ────────────────────────────────────────────────────
  const MSG_SYNC_SHORT = 'VDO Sync has not answered: nothing is pushed until it does';
  const MSG_SYNC_LONG = 'no saved config from Streamer.bot: a fresh install, or VDO Sync is missing or not compiled';
  const SYNC_RETRY_MS = [2000, 4000, 8000]; // then every SYNC_REPEAT_MS
  const SYNC_REPEAT_MS = 15000;
  const SYNC_SAY_MS = 1200;
  const SYNC_NAME_CAUSES_MS = 5000;
  function markSynced() {
    if (synced) return;
    synced = true;
    clearTimeout(syncTimer);
  }
  // The status for a page that holds its config: idle when there is no director to run, else
  // the room and how many guests the last poll saw.
  function showSteady() {
    if (frameUrl) show(`room ${cfg.room} · ${roster.length} guest(s)`);
    else show(cfg.enabled ? 'no room configured' : 'director disabled');
  }
  // Re-ask for the saved config until it arrives: after 2, 4, 8 s, then every 15 s.
  function scheduleResync(n) {
    clearTimeout(syncTimer);
    if (synced) return;
    syncTimer = setTimeout(() => {
      if (synced) return;
      doAction(SYNC_ACTION, { reason: 'director-min-retry' });
      scheduleResync(n + 1);
    }, n < SYNC_RETRY_MS.length ? SYNC_RETRY_MS[n] : SYNC_REPEAT_MS);
  }

  // Auto-populate from whoever is live right now. Returns true if the directory
  // grew/changed — the caller pushes. Deterministic (directory-core sorts its
  // candidates), so control.html running the same inputs lands on the same array.
  function runAutoAdd() {
    if (!synced || !cfg.directoryAutoAdd) return false;
    const res = GRDir.autoPopulate({
      directory: cfg.directory,
      ignored: cfg.directoryIgnored,
      labels: roster.map((g) => g.label),
      users: discordUsers,
    });
    if (!res.changed) return false;
    cfg.directory = res.directory;
    return true;
  }

  function assemblePayload() {
    const byLabel = new Map(roster.map((g) => [g.label, g.streamID]));
    const slots = cfg.slots.map((s, i) => {
      const streamID = hasRoster
        ? (s.label ? (byLabel.get(s.label) || '') : '')
        : String(s.streamID || '');
      s.streamID = streamID;
      return Object.assign({
        slot: i + 1,
        label: s.label || '',
        streamID,
        mirror: !!s.mirror,
        mode: s.mode === 'discord' ? 'discord' : 'webcam',
        discordUserId: String(s.discordUserId || '').replace(/\D/g, ''),
      }, GRDir.extraFields(s, SLOT_KEYS));
    });
    return Object.assign({ enabled: !!cfg.enabled, room: cfg.room || '', password: cfg.password || '',
      viewFlags: cfg.viewFlags || '', slots, invite: cfg.invite || {},
      directory: sanitizeDirectory(cfg.directory),
      directoryAutoAdd: cfg.directoryAutoAdd !== false,
      directoryIgnored: GRDir.sanitizeIgnored(cfg.directoryIgnored),
      schemaVersion: SCHEMA_VERSION }, cfg.extra);
  }

  // fromRoster: a resolution-driven push needs BOTH gates — synced (never
  // clobber persisted state with defaults) and hasRoster (never blank slots
  // before our own director has spoken). A directory-driven push (auto-add from
  // the Discord feed, which needs no director at all) only needs synced;
  // assemblePayload preserves the adopted streamIDs while hasRoster is false.
  function assembleAndPush(fromRoster) {
    if (schemaTooNew) return;
    if (!synced) return;
    if (fromRoster && !hasRoster) return;
    const payload = JSON.stringify(assemblePayload());
    if (payload === lastPushedSig) return;
    // Record it as pushed only if it was sent: with the socket down the next poll must retry.
    if (!doAction(PUSH_ACTION, { payload })) return;
    lastPushedSig = payload;
    show(`room ${cfg.room} · ${roster.length} guest(s) · pushed`);
  }

  // ── SB WS client ──────────────────────────────────────────────────────────
  const MSG_AUTH = 'SB auth enforced — turn Enforce off';
  const SYNC_FALLBACK_MS = 400; // sync anyway if the Subscribe is never answered
  let ws = null;
  let msgId = 0;
  let subId = null;
  let reconnectTimer = null;
  let authEnforced = false; // the last Hello carried an authentication block
  const backoff = sbBackoff();
  const pendingActions = new Map(); // DoAction id -> action name, until its reply arrives

  // Returns whether the request was actually sent (false while the socket is down).
  function doAction(name, args) {
    if (!ws || ws.readyState !== 1) return false;
    const id = String(++msgId);
    ws.send(JSON.stringify({ request: 'DoAction', id, action: { name }, args }));
    pendingActions.set(id, name);
    if (pendingActions.size > 200) pendingActions.delete(pendingActions.keys().next().value);
    return true;
  }
  const isRefusal = (m) => typeof m.status === 'string' && m.status !== 'ok';
  const refusalText = (m) => String(m.error || m.message || m.status);

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(connect, backoff.next());
  }

  function connect() {
    reconnectTimer = null;
    let sock;
    try { sock = new WebSocket(WS_URL); }
    catch (err) { connProblem = 'cannot open the WebSocket — retrying'; show(''); scheduleReconnect(); return; }
    ws = sock; // every handler below acts on its own socket, never on a later one
    let syncFired = false;
    let syncTimer = null;
    let healthy = false;
    const fireSync = () => {
      if (syncFired) return;
      syncFired = true;
      clearTimeout(syncTimer);
      doAction(SYNC_ACTION, { reason: 'director-min-connect' });
      scheduleResync(0);
    };
    // A healthy session (a valid Subscribe ack, or an event) clears a connection problem and
    // resets the backoff; merely opening does not.
    const markHealthy = () => {
      if (healthy) return;
      healthy = true;
      authEnforced = false;
      backoff.reset();
      if (connProblem) { connProblem = ''; if (synced) showSteady(); else show('connected to SB — waiting for state'); }
    };
    sock.onopen = () => {
      if (!connProblem) {
        if (!synced) show('connected to SB — waiting for state');
        else showSteady(); // reconnected after SB went away: replace 'SB offline — retrying'
      }
      subId = String(++msgId);
      sock.send(JSON.stringify({ request: 'Subscribe', id: subId, events: { general: ['Custom'] } }));
      syncTimer = setTimeout(fireSync, SYNC_FALLBACK_MS);
      // Say why nothing is happening while the saved config has not come back.
      setTimeout(() => { if (!synced) show(MSG_SYNC_SHORT); }, SYNC_SAY_MS);
      setTimeout(() => { if (!synced) show(MSG_SYNC_LONG); }, SYNC_NAME_CAUSES_MS);
    };
    sock.onmessage = (evt) => {
      if (ws !== sock) return;
      let m;
      try { m = JSON.parse(evt.data); } catch { return; }
      if (!m || typeof m !== 'object') return;
      // Streamer.bot's Hello: an authentication block means "Enforce authentication" is on.
      if (m.request === 'Hello') {
        authEnforced = !!(m.authentication && typeof m.authentication === 'object');
        if (authEnforced) { connProblem = MSG_AUTH; show(''); }
        return;
      }
      if (m.id && !m.event) {
        if (m.id === subId) {
          if (isRefusal(m)) { // no sync without an accepted Subscribe
            clearTimeout(syncTimer);
            syncFired = true;
            if (!authEnforced) { connProblem = 'SB: Subscribe refused (' + refusalText(m) + ')'; show(''); }
          } else { markHealthy(); fireSync(); }
          return;
        }
        if (pendingActions.has(m.id)) {
          const name = pendingActions.get(m.id);
          pendingActions.delete(m.id);
          if (isRefusal(m) && !authEnforced) { connProblem = 'SB: DoAction "' + name + '" refused (' + refusalText(m) + ')'; show(''); }
          return;
        }
      }
      if (!(m.event && m.event.source === 'General' && m.event.type === 'Custom')) return;
      markHealthy();
      let d = m.data;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch { return; } }
      if (!d || typeof d !== 'object') return;
      if (d.type === 'vdoninja:update') {
        const v = frameState(d, 'vdoninja', 'vdoninjaJson');
        if (!v) return; // no usable state in the frame: drop it, never mark the page synced
        const sig = JSON.stringify(v);
        if (sig === lastPushedSig) { markSynced(); showSteady(); return; } // our own echo
        if (!adoptCfg(v)) return; // not config-shaped: drop it
        markSynced();
        lastPushedSig = JSON.stringify(assemblePayload());
        syncDirectorFrame();
        // syncDirectorFrame says nothing when the frame URL did not change, so a late
        // reply for a disabled config would leave 'has not answered' on screen.
        showSteady();
        if (runAutoAdd()) assembleAndPush(false); // late arrivals in a replayed room
      } else if (d.type === 'vdo:sync:empty') {
        // VDO Sync found no saved vdo.state: nothing to adopt, nothing to overwrite.
        markSynced();
        show('no saved config yet');
      } else if (d.type === 'discord:voice:update') {
        // Voice-channel arrivals are an auto-add source of their own — no director
        // and no room needed. This feed is chatty (~10/s while people talk); the
        // push only happens when the directory actually grew.
        const dv = frameState(d, 'discordVoice', 'discordVoiceJson');
        if (!dv) return;
        const users = dv.users;
        discordUsers = (users && typeof users === 'object') ? users : {};
        if (runAutoAdd()) assembleAndPush(false);
      }
    };
    sock.onclose = () => {
      clearTimeout(syncTimer);
      syncFired = true;
      if (ws !== sock) return;
      pendingActions.clear();
      show('SB offline — retrying');
      scheduleReconnect();
    };
    sock.onerror = () => {};
  }

  // ── Director iframe + loop (same as control.html, minus the editor) ────────
  function directorUrl() {
    if (!cfg.enabled || !cfg.room) return '';
    const sep = DIRECTOR_BASE.includes('?') ? '&' : '?';
    let u = DIRECTOR_BASE + sep + 'director=' + encodeURIComponent(cfg.room);
    if (cfg.password) u += '&password=' + encodeURIComponent(cfg.password);
    u += '&cleanish&novideo&noaudio';
    return u;
  }

  function syncDirectorFrame() {
    const url = directorUrl();
    if (url === frameUrl) return;
    frameUrl = url;
    if (url) {
      director.src = url;
      show(`room ${cfg.room} · director connecting…`);
      startPolling();
    } else {
      director.src = 'about:blank';
      stopPolling();
      roster = [];
      hasRoster = false;
      show(cfg.enabled ? 'no room configured' : 'director disabled');
    }
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(pollGuestList, POLL_MS);
    setTimeout(pollGuestList, FIRST_PROBE_MS);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  function pollGuestList() {
    if (!frameUrl || !director.contentWindow) return;
    try {
      director.contentWindow.postMessage({ getGuestList: true, cib: 'sb-vdo-min' }, DIRECTOR_ORIGIN);
    } catch (_) { /* iframe not ready yet */ }
  }

  window.addEventListener('message', (e) => {
    if (e.origin !== DIRECTOR_ORIGIN) return;
    const d = e.data;
    if (!d || typeof d !== 'object' || !('guestList' in d)) return;
    roster = VdoParse.parseGuestList(d);
    hasRoster = true;
    show(`room ${cfg.room} · ${roster.length} guest(s)`);
    runAutoAdd(); // new label in the room → placeholder nameplate entry
    assembleAndPush(true); // auto-follow: re-resolve every poll
  });

  if (!WS_URL) { // an invalid ?sbport: say so, and never connect (nor fall back to 8080)
    connProblem = 'invalid ?sbport (use a port number, 1-65535)';
    show('');
    console.error('[director-min] invalid ?sbport ' + JSON.stringify(P.get('sbport')) + ': use a port number from 1 to 65535. Not connecting.');
  } else {
    show('connecting to SB…');
    connect();
  }
})();
</script>
</body>
</html>
