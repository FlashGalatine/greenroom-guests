<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Greenroom — VDO.ninja guest slot</title>
<!--
  Greenroom guest slot — one OBS Browser Source per slot:
    http://127.0.0.1:7474/greenroom-overlay/vdoninja-guest.html?slot=1   (…2, 3, 4)
  Add each slot source ONCE and reuse it in other scenes with Add Existing / Paste (Reference), never a new source or
  Paste (Duplicate): every copy is one more viewer, and one more full stream for the guest's PC to send.

  SERVE OVER HTTP (Streamer.bot's HTTP Server, docs/STREAMERBOT-SETUP.md) — NOT as
  an OBS "Local file" source: the embedded vdo.ninja WebRTC viewer needs a
  secure-context (localhost http) parent or it renders black, and file:// sources
  also ignore ?slot=/?sbport= URL params.

  Two source modes per slot (chosen in control/control.html):
    • webcam  — a VDO.ninja solo view of the guest bound to this slot.
    • discord — a placeholder showing the bound Discord user's avatar, lit up when
                they speak (fed by the Discord bridge sidecar).

  A guest matched by the payload's `directory` (control page: Nameplates & Guest
  Directory) also gets a lower-third nameplate — display name + rotating social
  handles. No directory entry → no nameplate.

  Config (URL params, since this is http-served): ?slot=N · ?sbport=<n> · ?sbdebug=1
    ?nameplate=0             disable the lower-third (default on)
    ?nppos=bl|br|tl|tr       nameplate corner (default bl = bottom-left)
    ?npaccent=<name|R,G,B>   accent: cyan | magenta | neon-green | triplet
    ?npsize=<px>             display-name font size (handle/icon scale with it)
-->
<script>
  // The sync action replays both cached blobs on connect (see actions/vdo-sync.cs).
  window.__SB_SYNC_ACTION = 'VDO Sync';
</script>
<script src="panel-client-sb.js"></script>
<script src="nameplate-shared.js"></script>
<script src="vdo-url.js"></script>
</head>
<body>
<script>
// Render logic ported unchanged from the toolkit's Figma/StreamOverlay/vdoninja-guest.js —
// it already consumed the generic `svc:message` event, so only the transport moved.
(function () {
  'use strict';

  // The slot is 1 to 4, written exactly (no ?slot means slot 1). Anything else (slot=5, slot=abc, slot=2x) is 0: this source shows nothing and
  // says so in the console (and on the page with ?sbdebug=1), instead of quietly showing slot 1 (GRN-144).
  function resolveSlot() {
    const q = new URLSearchParams(location.search);
    const raw = window.__VDO_SLOT !== undefined ? String(window.__VDO_SLOT).trim() : q.has('slot') ? String(q.get('slot') ?? '').trim() : '1';
    if (/^[1-4]$/.test(raw)) return Number(raw);
    console.warn('[greenroom] this guest slot source has a bad slot (' + JSON.stringify(raw) + '): use ?slot=1 to 4. It shows nothing.');
    return 0;
  }
  const SLOT = resolveSlot();

  const Q = new URLSearchParams(location.search);
  const NP_ON = Q.get('nameplate') !== '0'; // lower-third on by default
  const NP_POS = ['bl', 'br', 'tl', 'tr'].includes(Q.get('nppos')) ? Q.get('nppos') : 'bl';
  const NP_ACCENT = GRNameplate.accentTriplet(Q.get('npaccent'));
  const NP_SIZE = parseInt(Q.get('npsize'), 10) || 0;

  // Transparent + size-agnostic: the OBS source dimensions decide. The speaking
  // glow reuses the neon-green (57,255,20) language shared with the roster overlay.
  const style = document.createElement('style');
  style.textContent =
    'html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}' +
    '#frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:transparent}' +
    '#dpfp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent}' +
    '#dpfp[hidden]{display:none}' +
    '#dpfp img{width:min(60vmin,60%);aspect-ratio:1;border-radius:50%;object-fit:cover;' +
      'opacity:.82;filter:brightness(70%) saturate(85%);' +
      'box-shadow:0 0 0 2px rgba(255,255,255,.10);' +
      'transition:opacity .15s ease, filter .15s ease, box-shadow .2s ease}' +
    '#dpfp.speaking img{opacity:1;filter:brightness(112%) saturate(112%);' +
      'box-shadow:0 0 0 3px rgba(57,255,20,.95),0 0 22px 6px rgba(57,255,20,.8);' +
      'animation:dpfp-blink .9s ease-in-out infinite}' +
    'body.offline #dpfp.speaking img{animation:none;box-shadow:0 0 0 2px rgba(255,255,255,.10)}' +
    '#dpfp.no-blink.speaking img{animation:none}' +
    '@keyframes dpfp-blink{' +
      '0%,100%{box-shadow:0 0 0 3px rgba(57,255,20,.9),0 0 12px 3px rgba(57,255,20,.6)}' +
      '50%{box-shadow:0 0 0 3px rgba(57,255,20,1),0 0 26px 8px rgba(57,255,20,1)}}' +
    // Nameplate positioning only — the plate's own look lives in
    // nameplate-shared.js (var(--np-*)-driven, docs/THEMING.md).
    'body .np-plate{position:absolute;z-index:3;max-width:calc(100% - 24px)}' +
    'body[data-nppos="bl"] .np-plate{left:12px;bottom:12px}' +
    'body[data-nppos="br"] .np-plate{right:12px;bottom:12px}' +
    'body[data-nppos="tl"] .np-plate{left:12px;top:12px}' +
    'body[data-nppos="tr"] .np-plate{right:12px;top:12px}';
  document.head.appendChild(style);

  const frame = document.createElement('iframe');
  frame.id = 'frame';
  frame.src = 'about:blank';
  frame.allow = 'autoplay; fullscreen';
  frame.referrerPolicy = 'no-referrer';
  document.body.appendChild(frame);

  const dpfp = document.createElement('div');
  dpfp.id = 'dpfp';
  dpfp.hidden = true;
  const dpfpImg = document.createElement('img');
  dpfpImg.alt = '';
  dpfp.appendChild(dpfpImg);
  document.body.appendChild(dpfp);

  // Lower-third nameplate (?nameplate=0 → never created; a test asserts absence).
  let plate = null;
  if (NP_ON) {
    GRNameplate.injectCss();
    document.body.dataset.nppos = NP_POS;
    plate = GRNameplate.buildPlate(document.body, { accent: NP_ACCENT, nameSizePx: NP_SIZE });
  }

  let lastUrl = '';
  let lastVdo = null;       // latest vdoninja config payload (slots, room, flags…)
  let lastDiscord = null;   // latest discord voice feed { channelId, users:{…} }
  let dpfpUserId = '';      // the user id currently shown (for onerror fallback)
  let dpfpWantUrl = '';     // the picture last asked for (a failed one is not asked for again on every update)

  // Feed liveness (GRN-34): the bridge pushes at least every `hb` ms; three missed beats and the feed is stale, which means nobody speaks.
  // A payload without `hb` (an older bridge, a single replayed push) is never stale. Timing uses the page's monotonic clock (a step of the
  // system clock changes nothing); hb counts only as a number, between a floor and a ceiling; age only as a number, between 0 and three
  // heartbeats (the same rules as the roster's, overlay/discord-roster.html).
  const HB_FLOOR = 1000;
  const HB_CEIL = 60000;
  let fed = false;
  let lastFeedAt = 0;
  let wasStale = false;
  const feedHb = () => { const h = lastDiscord && lastDiscord.hb; return typeof h === 'number' && Number.isFinite(h) && h > 0 ? Math.min(HB_CEIL, Math.max(HB_FLOOR, h)) : 0; };
  const isStale = () => { const hb = feedHb(); return hb > 0 && fed && performance.now() - lastFeedAt > 3 * hb; };
  const noteFeed = (msg) => {
    const a = msg && msg.age;
    const age = typeof a === 'number' && Number.isFinite(a) ? Math.max(0, Math.min(a, 3 * feedHb())) : 0;
    fed = true;
    lastFeedAt = performance.now() - age;
  };

  // A missing/broken avatar image falls back to the user's default embed avatar, and the real one is tried again a minute later.
  dpfpImg.addEventListener('error', () => {
    if (!dpfpUserId) return;
    const fallback = defaultAvatar(dpfpUserId);
    if (dpfpImg.getAttribute('src') !== fallback) dpfpImg.src = fallback;
    setTimeout(() => { dpfpWantUrl = ''; }, 60000);
  });

  // The view URL is built by the shared helper (vdo-url.js): the password encoded the way vdo.ninja reads it, the saved flags
  // normalised and stripped of anything that could load script or style or change the room, and the view solo unless asked otherwise.
  function buildUrl(v, streamID) { return GRVdoUrl.buildViewUrl(v, streamID); }

  // vdo.ninja refuses to run inside a page that is not a secure context, so a viewer started here would stay black for ever: say so.
  const INSECURE = !window.isSecureContext;
  const err = document.createElement('div');
  err.hidden = true;
  {
    err.id = 'insecure';
    err.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;padding:8px 10px;background:rgba(0,0,0,.75);color:#ffb454;font:14px/1.4 Consolas,monospace;border:1px solid #ffb454;z-index:10';
    err.textContent = 'This source is not on a secure origin, so vdo.ninja would refuse to play. Open it via http://127.0.0.1:<port>/ (not a LAN name).';
    document.body.appendChild(err);
  }
  // shown only for a webcam slot that has a guest to show: a Discord-mode slot needs no vdo.ninja and an empty slot shows nothing
  const showInsecure = (on) => { err.hidden = !(INSECURE && on); };

  function defaultAvatar(userId) {
    // Default embed avatar index for the new username system: (id >> 22) % 6.
    // BigInt is mandatory — a Number shift overflows the 64-bit snowflake.
    let idx = 0;
    try { idx = Number((BigInt(userId) >> 22n) % 6n); } catch (_) { idx = 0; }
    return 'https://cdn.discordapp.com/embed/avatars/' + idx + '.png';
  }

  function slotFor(v) {
    const slots = v && Array.isArray(v.slots) ? v.slots : [];
    return slots.find((s) => s && Number(s.slot) === SLOT) || null;
  }

  function render() {
    if (SLOT === 0) { // a bad ?slot: nothing (see resolveSlot), and with ?sbdebug=1 a hint on the page
      frame.style.display = 'none'; dpfp.hidden = true;
      if (Q.get('sbdebug') === '1' && !document.getElementById('slothint')) {
      const h = document.createElement('div');
      h.id = 'slothint';
      h.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;padding:8px 10px;background:rgba(0,0,0,.75);color:#ffb454;font:14px/1.4 Consolas,monospace;border:1px solid #ffb454;z-index:10';
      h.textContent = 'Bad slot in this source\'s URL: use ?slot=1 to 4. It shows nothing.';
      document.body.appendChild(h);
      }
      return;
    }
    const mine = slotFor(lastVdo);
    if (mine && mine.mode === 'discord') renderDiscord(mine);
    else renderWebcam(lastVdo, mine);
    // setEntry is signature-deduped, so the ~10/s voice feed never restarts the
    // social rotator mid-cycle.
    if (plate) plate.setEntry(GRNameplate.resolvePlateEntry(lastVdo, SLOT));
  }

  function renderWebcam(v, mine) {
    dpfp.hidden = true;
    frame.style.display = 'block';

    const streamID = mine && mine.streamID ? String(mine.streamID) : '';
    // Per-slot horizontal mirror, applied as a CSS transform on the iframe —
    // instant, no reload, works on the cross-origin vdo.ninja viewer.
    frame.style.transform = mine && mine.mirror ? 'scaleX(-1)' : 'none';

    showInsecure(!!(v && streamID));
    const url = !INSECURE && v && streamID ? buildUrl(v, streamID) : 'about:blank';
    // Only reload the iframe when the resolved URL actually changes, so unrelated
    // pushes (another slot updating, or the voice feed) never interrupt our video.
    if (url !== lastUrl) {
      frame.src = url;
      lastUrl = url;
    }
  }

  function renderDiscord(mine) {
    showInsecure(false);
    // Blank + hide the iframe so its WebRTC viewer tears down (no phantom video).
    if (lastUrl !== 'about:blank') { frame.src = 'about:blank'; lastUrl = 'about:blank'; }
    frame.style.display = 'none';
    frame.style.transform = 'none';

    const userId = mine && mine.discordUserId ? String(mine.discordUserId) : '';
    if (!userId) {
      // Slot is in Discord mode but no user picked yet — show nothing.
      dpfp.hidden = true;
      dpfp.classList.remove('speaking');
      dpfpUserId = '';
      dpfpWantUrl = '';
      return;
    }

    dpfp.hidden = false;
    if (dpfpUserId !== userId) dpfpWantUrl = '';
    dpfpUserId = userId;
    const stale = isStale();
    wasStale = stale;
    const users = lastDiscord && lastDiscord.users && typeof lastDiscord.users === 'object' && !Array.isArray(lastDiscord.users) ? lastDiscord.users : {};
    const u = users[userId] && typeof users[userId] === 'object' ? users[userId] : null;

    // Real PFP when the guest is in the call; default embed avatar otherwise.
    const avatarUrl = (u && typeof u.avatarUrl === 'string' && u.avatarUrl) || defaultAvatar(userId);
    if (dpfpWantUrl !== avatarUrl) { dpfpWantUrl = avatarUrl; dpfpImg.src = avatarUrl; }

    // Speaking only while the feed is live and the bot is in the channel (a stale feed, a bridge that gave up its voice connection, or one
    // that is offline says nothing about who is speaking now).
    const live = !stale && !!lastDiscord && !!lastDiscord.connected && !!lastDiscord.hostInChannel;
    dpfp.classList.toggle('speaking', live && !!(u && u.speaking));
    // The shared blink setting (the roster's too): off means a steady glow.
    dpfp.classList.toggle('no-blink', !!(lastDiscord && lastDiscord.settings && lastDiscord.settings.neonBlink === false));
  }

  // The socket closed (Streamer.bot quit or restarted): nobody is "speaking" any more. Keep the
  // avatars and the last feed; only the live speaking flags go.
  window.addEventListener('svc:disconnect', () => {
    if (lastDiscord && lastDiscord.users) {
      for (const id of Object.keys(lastDiscord.users)) {
        const u = lastDiscord.users[id];
        if (u && typeof u === 'object') u.speaking = false;
      }
    }
    render();
  });

  window.addEventListener('svc:message', (e) => {
    const msg = e.detail;
    if (!msg) return;
    if (msg.type === 'sync') {
      // Legacy StreamService shape; under Streamer.bot the VDO Sync action replays
      // the two typed messages below instead. Kept for transport symmetry.
      // Assign only the fields the message carries: a bare {type:'sync'} must not blank the slot.
      if (msg.vdoninja !== undefined) lastVdo = msg.vdoninja || null;
      if (msg.discordVoice !== undefined) { lastDiscord = msg.discordVoice || null; noteFeed(msg); }
      render();
    } else if (msg.type === 'vdoninja:update') {
      lastVdo = msg.vdoninja || null;
      render();
    } else if (msg.type === 'discord:voice:update') {
      lastDiscord = msg.discordVoice || null;
      noteFeed(msg);
      render();
    }
  });

  // A feed that has just gone stale (the bridge died) redraws: the glow goes out.
  setInterval(() => { if (isStale() !== wasStale) render(); }, 1000);
})();
</script>
</body>
</html>
