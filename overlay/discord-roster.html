<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Greenroom — Discord voice roster</title>
<!--
  Greenroom Discord voice roster — the standalone channel overlay (the StreamKit
  replacement): every member of the watched voice channel as an avatar with a
  speaking glow, mute/deaf badges, and optional name labels.

  OBS Browser Source URL (docs/STREAMERBOT-SETUP.md):
    http://127.0.0.1:7474/greenroom-overlay/discord-roster.html?layout=row

  Fed by the Discord bridge sidecar's `discord:voice:update`. It also consumes
  `vdoninja:update` for the guest `directory` (control page: Nameplates & Guest
  Directory): a member whose user id matches a directory entry is labeled with
  that entry's displayName instead of their live Discord name.

  Config precedence per render: URL param > payload settings block > built-in
  default (docs/THEMING.md):

    ?layout=row|grid       row = one horizontal strip (default); grid = wrapping panel
    ?labels=0|1            show usernames under avatars (default 1)
    ?avatar=<px>           guest avatar size        (settings.avatarPx,   default 56)
    ?streamerpx=<px>       streamer avatar size     (settings.streamerPx, default 72)
    ?accent=<name|R,G,B>   glow color: cyan | magenta | neon-green | "R,G,B" triplet
    ?streamer=<userId>     streamer-first ordering  (settings.streamerUserId)
    ?hidewhenabsent=0|1    hide everything when the streamer isn't in voice
    ?theme=plain           second look: no chips/scanlines/blink, thin speaking ring
    ?max=<n>               cap rendered members; the rest collapse into a "+N" chip
    ?sbport=<n> ?sbdebug=1 transport knobs (overlay/panel-client-sb.js)

  Re-theming = overriding the CSS custom properties in :root below (Cadence-style;
  see docs/THEMING.md for the variable reference), EXCEPT --accent, --avatar-px and --streamer-px:
  the script sets those three at runtime (?accent= / ?avatar= / ?streamerpx=, else the payload's
  settings), so an edit of them in :root is overwritten.
-->
<style>
  :root {
    /* ── Theme variables — override these to re-skin (docs/THEMING.md) ── */
    /* The next three are only the fallback before the script runs: it sets them at runtime (?accent=, ?avatar=, ?streamerpx=, else the
       payload's settings), so an edit here is overwritten. */
    --accent: 34, 211, 238;          /* speaking glow, R,G,B triplet (cyan) */
    --avatar-px: 56px;               /* guest avatar size */
    --streamer-px: 72px;             /* streamer avatar size */
    --gap: 14px;                     /* spacing between members */
    --name-size: 13px;
    --name-color: #eef2f5;
    --name-font: 'Segoe UI', system-ui, sans-serif;
    --chip-bg: rgba(10, 14, 18, .55);   /* per-member backing chip */
    --chip-pad: 8px;
    --badge-bg: rgba(15, 18, 22, .92);  /* mute/deaf badge disc */
    --badge-fg: #ff5560;                /* mute/deaf badge glyph */
    --blink-s: .9s;                     /* speaking pulse period */
    --radius: 14px;                     /* chip corner radius */
  }

  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--name-font); }
  body.absent #stage { display: none; }
  body.offline #stage { opacity: .35; filter: grayscale(1); }
  /* flex-start + margin:auto centres the roster while it fits and, if it ever does not (the automatic +N fold normally prevents it), clips only
     the trailing end instead of both ends (GRN-78). */
  #stage { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: flex-start; transition: opacity .3s ease; }

  #roster { display: flex; gap: var(--gap); align-items: flex-start; justify-content: center; margin: auto; }
  #roster.layout-row { flex-wrap: nowrap; }
  #roster.layout-grid { flex-wrap: wrap; max-width: 100%; }

  .member { display: flex; flex-direction: column; align-items: center; gap: 6px;
            background: var(--chip-bg); border-radius: var(--radius); padding: var(--chip-pad);
            position: relative; }
  body.fx-scanlines .member::after {
    content: ''; position: absolute; inset: 0; border-radius: var(--radius); pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px);
  }

  .avatar-wrap { position: relative; width: var(--avatar-px); height: var(--avatar-px); }
  .member.streamer .avatar-wrap { width: var(--streamer-px); height: var(--streamer-px); }
  .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
            opacity: .82; filter: brightness(70%) saturate(85%);
            box-shadow: 0 0 0 2px rgba(255,255,255,.10);
            transition: opacity .15s ease, filter .15s ease, box-shadow .2s ease; }
  .member.speaking .avatar { opacity: 1; filter: brightness(112%) saturate(112%);
            box-shadow: 0 0 0 3px rgba(var(--accent), .95), 0 0 22px 6px rgba(var(--accent), .8);
            animation: roster-blink var(--blink-s) ease-in-out infinite; }
  body.no-blink .member.speaking .avatar { animation: none; }
  @keyframes roster-blink {
    0%, 100% { box-shadow: 0 0 0 3px rgba(var(--accent), .9), 0 0 12px 3px rgba(var(--accent), .6); }
    50%      { box-shadow: 0 0 0 3px rgba(var(--accent), 1), 0 0 26px 8px rgba(var(--accent), 1); }
  }

  .badges { position: absolute; right: -4px; bottom: -4px; display: flex; gap: 2px; }
  .badge { width: calc(var(--avatar-px) * .38); height: calc(var(--avatar-px) * .38);
           min-width: 18px; min-height: 18px; border-radius: 50%; background: var(--badge-bg);
           display: none; align-items: center; justify-content: center; }
  .member.streamer .badge { width: calc(var(--streamer-px) * .34); height: calc(var(--streamer-px) * .34); }
  .badge svg { width: 68%; height: 68%; fill: var(--badge-fg); }
  .member.muted .badge.mute { display: flex; }
  .member.deafened .badge.deaf { display: flex; }
  .member.deafened .badge.mute { display: none; } /* deaf implies mute — show one badge, like Discord */

  .name { font-size: var(--name-size); color: var(--name-color); max-width: calc(var(--avatar-px) + 34px);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.7); }
  body.no-labels .name { display: none; }

  .overflow-chip { align-self: center; background: var(--chip-bg); border-radius: var(--radius);
          padding: 8px 12px; color: var(--name-color); font-size: calc(var(--name-size) + 2px); }

  /* ── ?theme=plain — the second look: quiet, chip-less, thin speaking ring ── */
  body.theme-plain .member { background: transparent; padding: 0; }
  body.theme-plain .member::after { content: none; }
  body.theme-plain .avatar { opacity: 1; filter: none; box-shadow: 0 0 0 2px rgba(255,255,255,.18); }
  body.theme-plain .member.speaking .avatar { animation: none;
          box-shadow: 0 0 0 3px rgb(var(--accent)); filter: none; }
  body.theme-plain .name { text-shadow: 0 1px 2px rgba(0,0,0,.45); } /* softer, but never invisible on light scenes */
</style>
<script>
  window.__SB_SYNC_ACTION = 'VDO Sync';
</script>
<script src="panel-client-sb.js"></script>
<script src="nameplate-shared.js"></script><!-- directory lookup only (no injectCss) -->
</head>
<body>
<div id="stage"><div id="roster" class="layout-row"></div></div>
<script>
(function () {
  'use strict';

  const P = new URLSearchParams(location.search);
  const numOr = (v, d) => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : d; };
  const boolOr = (v, d) => (v === '1' ? true : v === '0' ? false : d);

  const ACCENTS = { cyan: '34, 211, 238', magenta: '255, 0, 229', 'neon-green': '57, 255, 20' };
  function accentTriplet(name) {
    if (!name) return null;
    if (Object.hasOwn(ACCENTS, name)) return ACCENTS[name];
    return /^\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*$/.test(name) ? name : null;
  }

  const URL_CFG = {
    layout: P.get('layout'),
    labels: P.get('labels'),
    avatarPx: P.get('avatar'),
    streamerPx: P.get('streamerpx'),
    accent: P.get('accent'),
    streamer: P.get('streamer'),
    hideWhenAbsent: P.get('hidewhenabsent'),
    theme: P.get('theme'),
    max: P.get('max'),
  };

  const roster = document.getElementById('roster');
  const stageEl = document.getElementById('stage');
  let lastDiscord = null;
  let directory = []; // sanitized guest directory (rides vdoninja:update)
  let lastSig = '';
  const nodes = new Map(); // uid -> { root, img, name, wantUrl }

  // Feed liveness (GRN-34): the bridge pushes at least every `hb` ms; three missed beats and the feed is stale, which counts as nobody
  // there. A payload without `hb` (an older bridge, a single replayed push) is never stale. `age` (how old the push already was when it
  // reached us) is used when a producer sends it. hb and age are not part of the roster's DOM signature.
  // Timing uses the page's monotonic clock, so a step of the system clock (a time sync) neither hides a live feed nor keeps a dead one on air.
  // hb counts only when it is a number, raised to a floor and lowered to a ceiling (a bus client or a unit slip can send anything); age only
  // when it is a number, held between 0 and three heartbeats.
  const HB_FLOOR = 1000;
  const HB_CEIL = 60000;
  let fed = false;
  let lastFeedAt = 0;
  let wasStale = false;
  const feedHb = () => { const h = lastDiscord && lastDiscord.hb; return typeof h === 'number' && Number.isFinite(h) && h > 0 ? Math.min(HB_CEIL, Math.max(HB_FLOOR, h)) : 0; };
  const isStale = () => { const hb = feedHb(); return hb > 0 && fed && performance.now() - lastFeedAt > 3 * hb; };
  const noteFeed = (msg) => {
    const a = msg && msg.age;
    const age = typeof a === 'number' && Number.isFinite(a) ? Math.max(0, Math.min(a, 3 * feedHb())) : 0;
    fed = true;
    lastFeedAt = performance.now() - age;
  };
  const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);

  function defaultAvatar(userId) {
    let idx = 0;
    try { idx = Number((BigInt(userId) >> 22n) % 6n); } catch (_) { idx = 0; }
    return 'https://cdn.discordapp.com/embed/avatars/' + idx + '.png';
  }

  // Effective config: URL param > payload settings > default.
  function effective(settings) {
    const s = settings || {};
    // A size from the payload is clamped to the range the control page offers (any bus client, or an older bridge, can send anything);
    // a size from the URL is the operator's own.
    const px = (v, d, lo, hi) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.max(lo, Math.min(hi, n)) : d; };
    return {
      layout: URL_CFG.layout === 'grid' ? 'grid' : 'row',
      labels: boolOr(URL_CFG.labels, true),
      avatarPx: numOr(URL_CFG.avatarPx, px(s.avatarPx, 56, 24, 128)),
      streamerPx: numOr(URL_CFG.streamerPx, px(s.streamerPx, 72, 32, 160)),
      accent: accentTriplet(URL_CFG.accent) || accentTriplet(s.accent) || ACCENTS.cyan,
      // The URL's id is the operator's own. The payload's is taken only as a string of digits, as the bridge writes it: a number (a snowflake
      // loses its last digits as a JSON number) or an object is no id, and would hide the roster for good under hideWhenAbsent.
      streamer: URL_CFG.streamer ? String(URL_CFG.streamer).trim() : (typeof s.streamerUserId === 'string' && /^\d{1,32}$/.test(s.streamerUserId.trim()) ? s.streamerUserId.trim() : ''),
      hideWhenAbsent: boolOr(URL_CFG.hideWhenAbsent, s.hideWhenAbsent !== false),
      scanlines: s.scanlines !== false,
      neonBlink: s.neonBlink !== false,
      plain: URL_CFG.theme === 'plain',
      max: numOr(URL_CFG.max, 0),
    };
  }

  // The mute and deafen badge glyphs below are original drawings for this kit (not taken from another icon set), so they carry no notice.
  const SVG_MUTE = '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5.5-3a5.5 5.5 0 0 1-8.9 4.32l1.45-1.45A3.5 3.5 0 0 0 15.5 11H17.5zm-11 0c0 .6.1 1.19.28 1.73l-1.55 1.55A7.4 7.4 0 0 1 4.5 11h2zM12 18.4c.72 0 1.41-.12 2.06-.33l1.62 1.62A7.9 7.9 0 0 1 13 20.43V22h-2v-1.57a8 8 0 0 1-6.32-5.19l1.62-.6A6.4 6.4 0 0 0 12 18.4zM4.27 3 21 19.73 19.73 21 3 4.27 4.27 3z"/></svg>';
  const SVG_DEAF = '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v5a3 3 0 0 0 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5.06A7 7 0 0 1 12 5a7 7 0 0 1 6.94 7H17a2 2 0 0 0-2 2v1.1l4.86 4.86c.66-.55 1.14-1.37 1.14-2.36v-5a9 9 0 0 0-9-9zM4.27 4 21 20.73 19.73 22 3 5.27 4.27 4z"/></svg>';

  function buildMember(uid) {
    const root = document.createElement('div');
    root.className = 'member';
    root.dataset.uid = uid;

    const wrap = document.createElement('div');
    wrap.className = 'avatar-wrap';
    const img = document.createElement('img');
    img.className = 'avatar';
    img.alt = '';
    const node = { root, img, name: null, wantUrl: '' };
    // A picture that fails to load shows the default avatar, and is tried again a minute later (not on every update, and not never).
    img.addEventListener('error', () => {
      const fb = defaultAvatar(uid);
      if (img.getAttribute('src') !== fb) img.src = fb;
      // (the timer holds the id, not the member's nodes, so a member who has left is not kept alive for the minute)
      setTimeout(() => { const n = nodes.get(uid); if (n) n.wantUrl = ''; }, 60000);
    });
    const badges = document.createElement('div');
    badges.className = 'badges';
    badges.innerHTML = '<span class="badge mute" title="muted">' + SVG_MUTE + '</span>'
      + '<span class="badge deaf" title="deafened">' + SVG_DEAF + '</span>';
    wrap.appendChild(img);
    wrap.appendChild(badges);

    const name = document.createElement('div');
    name.className = 'name';

    root.appendChild(wrap);
    root.appendChild(name);
    node.name = name;
    return node;
  }

  function shownName(uid, u) {
    const d = GRNameplate.findByUserId(directory, uid);
    return String((d && !d.auto && d.displayName) || (u && u.username) || (d && d.displayName) || uid);
  }
  function orderedIds(users, streamerId) {
    // (an entry that is not an object, from a hand-edited feed or a bus client, is skipped)
    return Object.keys(users).filter((k) => isObj(users[k])).sort((a, b) => {
      if (a === streamerId) return -1;
      if (b === streamerId) return 1;
      const ua = String(shownName(a, users[a])).toLowerCase();
      const ub = String(shownName(b, users[b])).toLowerCase();
      return ua < ub ? -1 : ua > ub ? 1 : a < b ? -1 : 1;
    });
  }

  // The automatic +N fold (GRN-78): the most members that fit the stage, measured after layout; 0 = everyone fits (or not measured yet).
  // It is measured for what the roster looks like (fitKey: who is in the call, the names shown, the sizes, the layout) and kept across
  // messages: the bridge sends up to ten a second while people talk, and measuring means drawing the whole roster, which would restart the
  // speaking glow. It is measured again only when that changes or the stage is resized.
  let fitCap = 0;
  let fitKey = '';
  let fitDone = false;
  let fitBusy = false;
  let warnedFit = false;

  function render() {
    const dv = lastDiscord;
    const cfg = effective(dv && isObj(dv.settings) ? dv.settings : null);

    // Theme/effect classes + variables (cheap; applied every render so a
    // set-settings push restyles live).
    const rootStyle = document.documentElement.style;
    rootStyle.setProperty('--accent', cfg.accent);
    rootStyle.setProperty('--avatar-px', cfg.avatarPx + 'px');
    rootStyle.setProperty('--streamer-px', cfg.streamerPx + 'px');
    document.body.classList.toggle('theme-plain', cfg.plain);
    document.body.classList.toggle('no-labels', !cfg.labels);
    document.body.classList.toggle('no-blink', !cfg.neonBlink || cfg.plain);
    document.body.classList.toggle('fx-scanlines', cfg.scanlines && !cfg.plain);
    roster.className = 'layout-' + cfg.layout;

    // A feed that has stopped (the bridge died: three heartbeats missed) counts as nobody there, so hideWhenAbsent applies.
    const stale = isStale();
    wasStale = stale;
    const users = !stale && dv && isObj(dv.users) ? dv.users : {};
    // hideWhenAbsent follows the streamer when one is set (documented behaviour): the roster hides when they are not in the call.
    const streamerGone = !!cfg.streamer && !isObj(users[cfg.streamer]);
    const absent = !dv || !dv.connected || !dv.hostInChannel || Object.keys(users).length === 0 || streamerGone;
    document.body.classList.toggle('absent', cfg.hideWhenAbsent && absent);

    const all = orderedIds(users, cfg.streamer);
    const key = JSON.stringify([all, all.map((uid) => shownName(uid, users[uid])), cfg.layout, cfg.labels, cfg.avatarPx, cfg.streamerPx, cfg.streamer, cfg.plain, cfg.max]);
    if (key !== fitKey) {
      fitKey = key;
      fitCap = 0;
      fitDone = false;
      // a member who has left takes their nodes with them; one who is merely folded keeps theirs (and what they were asked for)
      const alive = new Set(all);
      for (const uid of [...nodes.keys()]) if (!alive.has(uid)) nodes.delete(uid);
    }
    let ids = all;
    let overflow = 0;
    const cap = Math.min(cfg.max > 0 ? cfg.max : Infinity, fitCap > 0 ? fitCap : Infinity);
    if (ids.length > cap) {
      overflow = ids.length - cap;
      ids = ids.slice(0, cap);
    }

    // Membership-keyed DOM diff: rebuild only when the member list (or order)
    // changes; speaking/mute/deaf are in-place class flips. This is what keeps a
    // 20-user channel at the sidecar's 100 ms coalesce cheap to render.
    const sig = JSON.stringify([ids, overflow, cfg.layout, cfg.labels]);
    if (sig !== lastSig) {
      lastSig = sig;
      roster.textContent = '';
      for (const uid of ids) {
        if (!nodes.has(uid)) nodes.set(uid, buildMember(uid));
        roster.appendChild(nodes.get(uid).root);
      }
      if (overflow > 0) {
        const chip = document.createElement('div');
        chip.className = 'overflow-chip';
        chip.textContent = '+' + overflow;
        roster.appendChild(chip);
      }
    }

    for (const uid of ids) {
      const u = users[uid];
      const n = nodes.get(uid);
      if (!u || !n) continue;
      const avatarUrl = typeof u.avatarUrl === 'string' && u.avatarUrl ? u.avatarUrl : defaultAvatar(uid);
      // Compared with what we asked for, not with the src (which a failed load replaced by the default avatar): a bad picture is not asked
      // for again on every update (the error handler clears wantUrl after a minute).
      if (n.wantUrl !== avatarUrl) { n.wantUrl = avatarUrl; n.img.src = avatarUrl; }
      // Directory override happens here (outside the membership sig) so a
      // directory edit restyles chips live without a rebuild.
      const label = shownName(uid, u);
      if (n.name.textContent !== label) { n.name.textContent = label; n.name.title = label; }
      n.root.classList.toggle('streamer', uid === cfg.streamer);
      n.root.classList.toggle('speaking', !!u.speaking);
      n.root.classList.toggle('muted', !!u.mute);
      n.root.classList.toggle('deafened', !!u.deaf);
    }
    if (!fitDone) fit();
  }

  // How many of the members now drawn fit the stage once the rest are folded into "+N" (the streamer is first, so is never the one folded):
  // 0 = they all fit, or folding cannot help. Row layout compares widths, grid layout heights; both are worked out from one measurement.
  function capacity(grid, room) {
    const kids = [...roster.children];
    const members = kids.filter((k) => k.classList.contains('member'));
    if (members.length < 2) return 0;
    const chip = roster.querySelector('.overflow-chip');
    const chipW = chip ? chip.offsetWidth : 64; // (before the chip is drawn: room kept for it)
    const chipH = chip ? chip.offsetHeight : 36;
    const gap = parseFloat(getComputedStyle(roster).columnGap) || 0;
    if (!grid) {
      if (kids.reduce((w, k, i) => w + k.offsetWidth + (i ? gap : 0), 0) <= room + 1) return 0;
      let w = 0, n = 0;
      for (let i = 0; i < members.length; i++) {
        const next = w + members[i].offsetWidth + (i ? gap : 0);
        if (next + gap + chipW > room && n >= 1) break;
        w = next; n = i + 1;
      }
      n = Math.max(1, Math.min(n, members.length - 1));
      return n;
    }
    if (roster.offsetHeight <= room + 1) return 0;
    // The rows the members fell into, and where each member's row ends; the "+N" chip joins the last row if it has room, else starts one.
    const origin = roster.getBoundingClientRect();
    const width = stageEl.clientWidth;
    const rowOf = [], right = [], rowBottom = [];
    let rowTop = -Infinity, row = -1;
    members.forEach((m, i) => {
      const r = m.getBoundingClientRect();
      if (r.top - origin.top > rowTop + 1) { row++; rowTop = r.top - origin.top; rowBottom[row] = 0; }
      rowOf[i] = row;
      right[i] = r.right - origin.left;
      rowBottom[row] = Math.max(rowBottom[row], r.bottom - origin.top);
    });
    for (let n = members.length - 1; n >= 1; n--) {
      const bottom = rowBottom[rowOf[n - 1]];
      const need = right[n - 1] + gap + chipW <= width + 0.5 ? bottom : bottom + gap + chipH;
      if (need <= room + 1) return n;
    }
    // Not even one row fits the height (a source shorter than a chip): folding by height cannot help, so keep what fits the first row, with
    // the chip at its end, and fold nothing if the first row holds everyone.
    let first = rowOf.filter((r) => r === 0).length;
    if (first >= members.length) return 0;
    while (first > 1 && right[first - 1] + gap + chipW > width + 0.5) first--;
    return first;
  }

  // Measure after layout: if the members (and the +N chip) do not fit the stage, lower the cap to what fits, fold the rest into "+N" and say
  // so once (GRN-78). The cap is worked out from one measurement and checked against the redrawn roster; it is kept in fitCap until the
  // roster changes or the stage is resized (see fitKey).
  function fit() {
    if (fitBusy) return;
    const grid = roster.classList.contains('layout-grid');
    const room = grid ? stageEl.clientHeight : stageEl.clientWidth;
    if (!room) return; // not laid out (hidden): measure when it is
    fitBusy = true;
    try {
      for (let pass = 0; pass < 8; pass++) {
        const shown = roster.querySelectorAll('.member').length;
        const n = capacity(grid, room);
        if (n < 1 || n >= shown) break;
        if (!warnedFit) { warnedFit = true; console.warn('[greenroom] the Discord roster does not fit this source: ' + (shown - n) + ' member(s) are folded into "+N". Make the browser source larger, or lower ?max=.'); }
        fitCap = n;
        render(); // (fitBusy: this redraw does not measure; the next pass does)
      }
      fitDone = true;
    } finally { fitBusy = false; }
  }

  window.addEventListener('svc:message', (e) => {
    const msg = e.detail;
    if (!msg) return;
    if (msg.type === 'discord:voice:update') {
      lastDiscord = msg.discordVoice || null;
      noteFeed(msg);
      render();
    } else if (msg.type === 'vdoninja:update') {
      // Stored and applied on every render — VDO Sync promises no order between
      // its two replays, so never assume arrival order.
      directory = GRNameplate.sanitizeDirectory(msg.vdoninja && msg.vdoninja.directory);
      render();
    } else if (msg.type === 'sync') {
      if (msg.vdoninja !== undefined) directory = GRNameplate.sanitizeDirectory(msg.vdoninja && msg.vdoninja.directory);
      if (msg.discordVoice !== undefined) { lastDiscord = msg.discordVoice || null; noteFeed(msg); }
      render();
    }
  });

  // The stage was resized (OBS source resized, or it was shown after being hidden): fit again from scratch. And once a second: a feed that
  // just went stale redraws as absent.
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => { fitCap = 0; fitDone = false; render(); }).observe(stageEl);
  setInterval(() => { if (isStale() !== wasStale) render(); }, 1000);

  render(); // initial paint (absent state) so hideWhenAbsent applies before first push
})();
</script>
</body>
</html>
